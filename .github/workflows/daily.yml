name: Daily football news

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily; off the hour, when GitHub's scheduler is busiest
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write          # needed only to push the `data` branch

concurrency:
  group: daily-football-news
  cancel-in-progress: false  # never let two runs write the database at once

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # minimum supported version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (offline)
        run: python -m pytest -q

      - name: Restore database and digests from the data branch
        run: bash scripts/data_branch.sh restore

      - name: Collect news, store and write digest
        env:
          # Optional. Unset secrets arrive as empty strings and those sources are skipped.
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        # Exits non-zero only if every attempted source failed; the job then fails and
        # nothing is published, so yesterday's data stays intact.
        run: python -m football_news run

      - name: Publish to the data branch
        run: bash scripts/data_branch.sh publish

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
